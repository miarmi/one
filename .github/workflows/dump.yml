name: dump
# Dump an idea: remove its previews and delete its branch. Also used after
# shipping, to tidy up. (Branch deletions made here don't trigger other
# workflows, so this removes the previews itself.)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to dump
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dump:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.LAB_RUNNER || 'lab-runner' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Remove previews and delete the branch
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          . platform/scripts/gh-lib.sh
          if [[ -z "$BRANCH" || "$BRANCH" == main || "$BRANCH" == -* ]]; then
            echo "::error::Refusing to dump '$BRANCH'"
            exit 1
          fi
          if [[ -n "$(jq -r '.server_ip // ""' lab.json)" ]] && preview="$(platform/scripts/preview-name.sh "$BRANCH")"; then
            platform/scripts/remove-previews.sh "$preview"
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null; then
            git push origin --delete "refs/heads/$BRANCH"
          fi
          gh_annotate notice "Dumped $BRANCH" "Previews removed and branch deleted"
          gh_summary "Dumped **$BRANCH**: its previews are gone and the branch is deleted."
