# Mode: bootstrap

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 200m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:7070;
        proxy_set_header X-Lab-Scheme $scheme;
    }
    location = /_lab/edge {
        default_type text/plain;
        return 200 "87c3adbccb27efbd\n";
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:7070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Lab-Scheme $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name hello.203-0-113-10.sslip.io;
    server_tokens off;
    client_max_body_size 200m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location = /_lab/auth {
        internal;
        proxy_pass http://127.0.0.1:7070/_lab/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Lab-Host $host;
    }
    location @lab_private {
        default_type text/plain;
        return 403 "This lab is private.\n";
    }
    location / {
        if ($lab_cookie_extra) {
            return 400;
        }
        satisfy any;
        allow 203.0.113.7;
        allow 198.51.100.0/24;
        deny all;
        auth_request /_lab/auth;
        error_page 401 403 = @lab_private;
        proxy_pass http://127.0.0.1:20000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Lab-Scheme $scheme;
        proxy_set_header Cookie $lab_app_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lab_connection_upgrade;
        proxy_read_timeout 300s;
    }
}
