server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hello.lab.example.com;
    server_tokens off;
    client_max_body_size 200m;
    ssl_certificate /etc/letsencrypt/live/hello.lab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hello.lab.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lab_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # /_lab/ belongs to the platform; signing in happens on the lab's own host.
    location ^~ /_lab/ {
        return 404;
    }
    location = /_lab/auth {
        internal;
        proxy_pass http://127.0.0.1:7070/_lab/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Lab-Host $host;
    }
    location @lab_login {
        rewrite ^ /_lab/redirect? break;
        proxy_pass http://127.0.0.1:7070;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Lab-Host $host;
        proxy_set_header X-Lab-Original-URI $request_uri;
        proxy_set_header X-Lab-Scheme $scheme;
    }
    location / {
        if ($lab_cookie_extra) {
            return 400;
        }
        satisfy any;
        allow 203.0.113.7;
        deny all;
        auth_request /_lab/auth;
        error_page 401 403 = @lab_login;
        proxy_pass http://127.0.0.1:20000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Lab-Scheme $scheme;
        proxy_set_header Cookie $lab_app_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lab_connection_upgrade;
        proxy_hide_header Strict-Transport-Security;
        proxy_read_timeout 300s;
    }
}

