server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lab.example.com;
    server_tokens off;
    client_max_body_size 200m;
    ssl_certificate /etc/letsencrypt/live/lab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lab_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        proxy_pass http://127.0.0.1:7070;
        proxy_set_header X-Lab-Scheme $scheme;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:7070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Lab-Scheme $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # labd's own pages: sign-in, setup, sign-out and the list of apps.
    location ^~ /_lab/ {
        proxy_pass http://127.0.0.1:7070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Lab-Scheme $scheme;
    }
    location = / {
        proxy_pass http://127.0.0.1:7070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Lab-Scheme $scheme;
    }
    location / {
        return 404;
    }
}

